name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse on a guide page and a player page
        run: |
          npx astro preview --port 4400 &
          npx wait-on@8.0.3 -t 60000 http://localhost:4400/
          # The player page shell (its data comes from the live API, or it shows why it can't).
          # Three runs per page and form; the check uses the median.
          for page in "guide http://localhost:4400/guides/mineshaft-gemstones/" "player http://localhost:4400/player-page/overview/?name=Debotes"; do
            set -- $page
            for run in 1 2 3; do
              npx -y lighthouse@12.8.2 "$2" --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=$1-mobile-$run.json --quiet
              npx -y lighthouse@12.8.2 "$2" --preset=desktop --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=$1-desktop-$run.json --quiet
            done
          done
          node scripts/lighthouse-check.mjs guide-*.json player-*.json
